<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Hours for PC ARES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dsp-purple': '#4B207F', 
                        'dsp-gold': '#CFB53B'    
                    }
                }
            }
        }
    </script>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <header class="bg-dsp-purple text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-dsp-gold rounded-full flex items-center justify-center font-bold text-dsp-purple border-2 border-white">
                ΔΣΠ
            </div>
            <h1 class="text-2xl font-bold">Office Hours for PC ARES</h1>
        </div>
        <button onclick="openAdminAuth()" class="text-2xl hover:text-dsp-gold transition-colors" title="Admin Portal">
            ⚙️
        </button>
    </header>

    <main class="p-8 max-w-6xl mx-auto">
        <h2 class="text-xl font-semibold mb-6 border-b-2 border-dsp-gold inline-block pb-1">Available Timeslots</h2>
        <div id="calendar-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

    <!-- Booking Modal -->
    <div id="booking-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md overflow-hidden">
            <div class="bg-dsp-purple text-white p-4 font-bold">Book Office Hours</div>
            <div class="p-6">
                <p id="modal-slot-info" class="text-sm text-gray-600 mb-4 font-medium"></p>
                <input type="hidden" id="book-slot-id">
                
                <label class="block text-sm font-semibold mb-1">Your Name</label>
                <input type="text" id="book-name" class="w-full border p-2 rounded mb-4 focus:ring-2 focus:ring-dsp-purple outline-none" placeholder="First and Last Name">
                
                <label class="block text-sm font-semibold mb-1">Meeting Topic</label>
                <select id="book-topic" class="w-full border p-2 rounded mb-4 focus:ring-2 focus:ring-dsp-purple outline-none">
                    <option value="" disabled selected>Select a topic...</option>
                    <option value="Resume Review">Resume Review</option>
                    <option value="Cover Letter Review">Cover Letter Review</option>
                    <option value="Behavioral Interview Prep">Behavioral Interview Prep</option>
                    <option value="Technical Interview Prep">Technical Interview Prep</option>
                    <option value="Pledging Specific Questions">Pledging Specific Questions</option>
                    <option value="Other">Other</option>
                </select>
                
                <label class="block text-sm font-semibold mb-1">Additional Information</label>
                <textarea id="book-info" class="w-full border p-2 rounded mb-4 h-24 focus:ring-2 focus:ring-dsp-purple outline-none" placeholder="Optional background notes..."></textarea>
                
                <div class="flex justify-end gap-3">
                    <button onclick="closeModal('booking-modal')" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Cancel</button>
                    <button id="confirm-btn" onclick="confirmMeeting()" class="px-4 py-2 bg-dsp-gold text-dsp-purple font-bold rounded hover:bg-yellow-500 transition-colors">Confirm Meeting</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="success-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-[60]">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-sm overflow-hidden relative text-center p-6">
            <button onclick="closeModal('success-modal')" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            
            <div class="text-5xl mb-4">✅</div>
            <h3 class="text-2xl font-bold text-dsp-purple mb-2">Meeting Confirmed!</h3>
            
            <div id="success-details" class="text-gray-700 text-sm mb-6 bg-gray-50 p-4 rounded text-left border border-gray-200"></div>
            
            <div class="grid grid-cols-1 gap-2">
                <a id="apple-calendar-btn" href="#" class="block w-full py-2 bg-gray-800 text-white font-bold rounded hover:bg-gray-900 transition-colors flex justify-center items-center gap-2">
                    🍎 Apple / Default
                </a>
                <a id="google-calendar-btn" href="#" target="_blank" class="block w-full py-2 bg-blue-600 text-white font-bold rounded hover:bg-blue-700 transition-colors flex justify-center items-center gap-2">
                    🔵 Google Calendar
                </a>
                <a id="outlook-calendar-btn" href="#" target="_blank" class="block w-full py-2 bg-blue-800 text-white font-bold rounded hover:bg-blue-900 transition-colors flex justify-center items-center gap-2">
                    📧 Outlook
                </a>
            </div>
        </div>
    </div>

    <!-- Admin Auth Modal -->
    <div id="admin-auth-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-sm p-6">
            <h3 class="text-lg font-bold mb-4">Admin Access</h3>
            <input type="password" id="admin-password" class="w-full border p-2 rounded mb-4" placeholder="Enter Password">
            <div class="flex justify-end gap-3">
                <button onclick="closeModal('admin-auth-modal')" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Cancel</button>
                <button onclick="verifyAdmin()" class="px-4 py-2 bg-dsp-purple text-white font-bold rounded">Login</button>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard Modal -->
    <div id="admin-dashboard-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg overflow-hidden">
            <div class="bg-dsp-purple text-white p-4 font-bold flex justify-between">
                <span>Create Availability</span>
                <button onclick="closeModal('admin-dashboard-modal')" class="text-white hover:text-dsp-gold text-xl">&times;</button>
            </div>
            <div class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Date</label>
                        <input type="date" id="admin-date" class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Start Time</label>
                        <input type="time" id="admin-start" class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">End Time</label>
                        <input type="time" id="admin-end" class="w-full border p-2 rounded">
                    </div>
                </div>
                
                <label class="block text-sm font-semibold mb-1">Host Admin</label>
                <select id="admin-host" class="w-full border p-2 rounded mb-4"></select>
                
                <label class="block text-sm font-semibold mb-1">Room Location</label>
                <input type="text" id="admin-location" class="w-full border p-2 rounded mb-4" placeholder="e.g., Heavener Hall 101 or Zoom Link">
                
                <button onclick="generateTimeslots()" class="w-full py-2 bg-dsp-purple text-white font-bold rounded hover:bg-purple-800 transition-colors">Generate 30-Min Slots</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
